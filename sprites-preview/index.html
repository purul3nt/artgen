<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a0e08" />
    <title>Odysseus sprite sheet · PixiJS player</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">artgen · sprite lab</p>
          <h1>Odysseus loop player</h1>
        </div>
        <div class="engine-badge"><span class="status-dot"></span> PixiJS 8 · AnimatedSprite</div>
      </header>

      <section class="workspace">
        <div class="stage-frame">
          <div id="pixi-host"></div>
          <div class="stage-caption">
            <span id="loopLabel">sip · 14 fps</span>
            <span id="frameReadout">frame 000 / 069</span>
          </div>
        </div>

        <aside class="control-panel">
          <p class="eyebrow">Loop</p>
          <div class="loop-buttons">
            <button class="loop-button is-active" data-loop="sip" type="button">Sip</button>
            <button class="loop-button" data-loop="cheers" type="button">Cheers</button>
            <button class="loop-button" data-loop="idle" type="button" disabled title="idle loop is generated separately">Idle <span class="soon">soon</span></button>
          </div>

          <p class="eyebrow">Speed</p>
          <div class="speed-row">
            <input id="speed" type="range" min="0.25" max="3" step="0.05" value="1" />
            <span id="speedLabel">1.00×</span>
          </div>

          <p class="eyebrow">Stage</p>
          <div class="toggle-row">
            <label class="auto-toggle">
              <input id="paused" type="checkbox" />
              <span class="toggle-track"></span>
              <span>Pause</span>
            </label>
            <label class="auto-toggle">
              <input id="checker" type="checkbox" checked />
              <span class="toggle-track"></span>
              <span>Checker bg</span>
            </label>
          </div>

          <div class="divider"></div>
          <p class="footnote">
            70 frames · 200×200 px · 14 fps over 5 s.<br />
            First and last frames match, so the loop is seamless.
          </p>
        </aside>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.13.2/dist/pixi.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
